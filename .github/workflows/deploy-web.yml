name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate content data
        run: python3 tools/validate_data.py

      - name: Setup Godot 4.7 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true

      - name: Export Web build
        run: |
          mkdir -p build/web
          touch build/.gdignore
          set -o pipefail
          timeout 90s godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-export-import.log
          if grep -E "SCRIPT ERROR:|ERROR:" /tmp/godot-export-import.log; then
            exit 1
          fi
          timeout 120s godot --headless --path . --export-release "Web" build/web/index.html
          python3 tools/run_checks.py --pack build/web/index.pck
          python3 tools/write_build_info.py build/web --commit "$GITHUB_SHA"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Verify served source identity, pack checksum and game tests
        run: |
          python3 -m py_compile tools/verify_deployment.py tools/write_build_info.py
          python3 tools/verify_deployment.py --expected-commit "$GITHUB_SHA"
