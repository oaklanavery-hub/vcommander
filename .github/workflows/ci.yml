name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Validate content, art, project and every regression suite
        run: python3 tools/run_checks.py

      - name: Render desktop visual QA with the Compatibility renderer
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          mkdir -p build/qa
          touch build/.gdignore
          set -o pipefail
          timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script tools/capture_ui.gd -- --output-dir=build/qa 2>&1 | tee /tmp/visual-qa.log
          if grep -E "SCRIPT ERROR:|ERROR:" /tmp/visual-qa.log; then
            exit 1
          fi
          test -s build/qa/commander.png
          test -s build/qa/army.png
          test -s build/qa/draft.png
          test -s build/qa/battle.png
          test -s build/qa/combat_effects.png
          test -s build/qa/result.png

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-qa
          path: build/qa
          retention-days: 7
