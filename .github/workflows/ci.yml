name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate content data
        run: python3 tools/validate_data.py

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Verify Godot project loads
        run: godot --headless --path . --editor --quit

      - name: Run set bonus tests
        run: godot --headless --path . --script tests/test_set_bonus_checker.gd

      - name: Run Army loadout tests
        run: godot --headless --path . --script tests/test_army_loadout.gd

      - name: Run Draft System tests
        run: timeout 30s godot --headless --path . --script tests/test_draft_system.gd
