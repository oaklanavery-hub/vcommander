name: CI

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Validate content, art, project and every regression suite
        run: python3 tools/run_checks.py

      - name: Render desktop visual QA with the Compatibility renderer
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          mkdir -p build/qa
          touch build/.gdignore
          set -o pipefail
          timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script tools/capture_ui.gd -- --output-dir=build/qa 2>&1 | tee /tmp/visual-qa.log
          if grep -E "SCRIPT ERROR:|ERROR:" /tmp/visual-qa.log; then
            exit 1
          fi
          test -s build/qa/commander.png
          test -s build/qa/menu.png
          test -s build/qa/menu_motion_1.png
          test -s build/qa/menu_motion_2.png
          test -s build/qa/menu_reduced_motion.png
          test -s build/qa/help.png
          test -s build/qa/settings.png
          test -s build/qa/pause.png
          test -s build/qa/army.png
          test -s build/qa/draft.png
          test -s build/qa/battle.png
          test -s build/qa/combat_effects.png
          test -s build/qa/result.png
          timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script tools/capture_battle_fx.gd -- --output-dir=build/qa 2>&1 | tee /tmp/battle-fx-qa.log
          if grep -E "SCRIPT ERROR:|ERROR:" /tmp/battle-fx-qa.log; then
            exit 1
          fi
          test -s build/qa/prebattle_fire.png
          test -s build/qa/prebattle_water.png
          test -s build/qa/prebattle_earth.png
          test -s build/qa/vine_drag.png
          timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script tools/capture_battle_readability.gd -- --output-dir=build/qa 2>&1 | tee /tmp/battle-readability-qa.log
          if grep -E "SCRIPT ERROR:|ERROR:" /tmp/battle-readability-qa.log; then
            exit 1
          fi
          test -s build/qa/frozen_field_late.png
          test -s build/qa/hearts_result.png
          test -s build/qa/contact_earth_hit.png
          test -s build/qa/attack_shoot_windup.png
          test -s build/qa/attack_slam_strike.png
          timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script tools/capture_summon_ownership.gd -- --output-dir=build/qa 2>&1 | tee /tmp/summon-ownership-qa.log
          if grep -E "SCRIPT ERROR:|ERROR:" /tmp/summon-ownership-qa.log; then
            exit 1
          fi
          test -s build/qa/summon_ownership_opening.png
          test -s build/qa/summon_ownership_battle.png
          test -s build/qa/summon_ownership_hit.png
          timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script tools/capture_slime.gd -- --output-dir=build/qa 2>&1 | tee /tmp/slime-qa.log
          if grep -E "SCRIPT ERROR:|ERROR:" /tmp/slime-qa.log; then
            exit 1
          fi
          test -s build/qa/slime_commander.png
          test -s build/qa/slime_army.png
          test -s build/qa/slime_royal_opening.png
          test -s build/qa/slime_split.png
          test -s build/qa/slime_cannon_hit.png
          test -s build/qa/slime_pool_late.png
          test -s build/qa/slime_ball_charged.png
          test -s build/qa/slime_ball_burst.png
          test -s build/qa/slime_ball_pushback.png
          test -s build/qa/slime_ball_death_burst.png
          test -s build/qa/slime_ball_burst_reduced.png
          timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script tools/capture_formations.gd -- --output-dir=build/qa 2>&1 | tee /tmp/formation-qa.log
          if grep -E "SCRIPT ERROR:|ERROR:" /tmp/formation-qa.log; then
            exit 1
          fi
          test -s build/qa/formation_water_opening.png
          test -s build/qa/formation_water_start.png
          test -s build/qa/formation_water_engagement.png
          test -s build/qa/formation_fire_start.png
          test -s build/qa/formation_earth_start.png
          test -s build/qa/formation_slime_start.png
          test -s build/qa/formation_ranged_start.png
          timeout 60s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script tools/capture_mastery.gd -- --output-dir=build/qa 2>&1 | tee /tmp/mastery-qa.log
          if grep -E "SCRIPT ERROR:|ERROR:" /tmp/mastery-qa.log; then
            exit 1
          fi
          test -s build/qa/mastery_new.png
          test -s build/qa/mastery_gallery.png
          test -s build/qa/mastery_reward_start.png
          test -s build/qa/mastery_level_up.png
          test -s build/qa/mastery_reduced_motion.png
          test -s build/qa/mastery_loss.png
          test -s build/qa/mastery_forfeit.png
          test -s build/qa/mastery_save_warning.png
          timeout 90s xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --script tests/test_private_presentation.gd -- --output-dir=build/qa 2>&1 | tee /tmp/private-qa.log
          if grep -E "SCRIPT ERROR:|ERROR:" /tmp/private-qa.log; then
            exit 1
          fi
          for view in warband lobby waiting draft menu opening battle reconnect result forfeit; do
            test -s "build/qa/pvp_${view}.png"
          done

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-qa
          path: build/qa
          retention-days: 7

  browser-pvp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Export the real browser game and test its pack
        run: |
          mkdir -p build/web
          touch build/.gdignore
          set -o pipefail
          timeout 90s godot --headless --path . --editor --quit 2>&1 | tee /tmp/pvp-import.log
          if grep -E "SCRIPT ERROR:|ERROR:" /tmp/pvp-import.log; then exit 1; fi
          timeout 120s godot --headless --path . --export-release Web build/web/index.html
          python3 tools/run_checks.py --pack build/web/index.pck
      - name: Install pinned browser QA runtime
        run: |
          npm install --prefix build/browser --no-save playwright@1.64.1
          build/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run two isolated WebGL2 game sessions against the authority
        run: |
          godot --headless --path . --script tools/run_private_server.gd -- --port=10000 > /tmp/pvp-server.log 2>&1 &
          server_pid=$!
          python3 tools/serve_private_browser_qa.py > /tmp/pvp-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$server_pid" "$web_pid" 2>/dev/null || true' EXIT
          python3 tools/check_private_container.py
          PVP_PLAYWRIGHT_MODULE="$PWD/build/browser/node_modules/playwright" timeout 240s node tools/check_private_browser.cjs
          if grep -E "SCRIPT ERROR:|ERROR:" /tmp/pvp-server.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-private-qa
          path: build/qa-browser
          retention-days: 7

  container-pvp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Build the exact free-host image
        run: docker build -t vcommander-private .
      - name: Verify the unprivileged image serves the real protocol
        run: |
          container_id=$(docker run --detach --memory 512m --publish 10000:10000 vcommander-private)
          trap 'docker stop "$container_id" >/dev/null; docker logs "$container_id"' EXIT
          python3 tools/check_private_container.py
          if docker logs "$container_id" 2>&1 | grep -E "SCRIPT ERROR:|ERROR:"; then exit 1; fi
